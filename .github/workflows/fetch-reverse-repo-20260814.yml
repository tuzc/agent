name: Fetch reverse repo spreadsheet update through 2026-08-14

on:
  push:
    branches:
      - temp-reverse-repo-20260817
    paths:
      - '.github/workflows/fetch-reverse-repo-20260814.yml'
      - 'scripts/fetch_reverse_repo_update_20260814.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip requests beautifulsoup4
      - name: Patch zero-operation parser
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/fetch_reverse_repo_update_20260814.py')
          text = path.read_text(encoding='utf-8')
          old = '        amount = None\n        for pattern in patterns:'
          new = '        amount = 0 if "操作量为零" in text else None\n        for pattern in patterns:'
          if old not in text:
              raise SystemExit('parser patch target missing')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - run: python scripts/fetch_reverse_repo_update_20260814.py
      - uses: actions/upload-artifact@v4
        with:
          name: reverse-repo-update-20260814
          path: data/reverse_repo_update_20260814/
          retention-days: 1

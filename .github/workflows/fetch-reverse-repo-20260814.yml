name: Fetch reverse repo spreadsheet update through 2026-08-14

on:
  push:
    branches:
      - temp-reverse-repo-20260817
    paths:
      - '.github/workflows/fetch-reverse-repo-20260814.yml'
      - 'scripts/fetch_reverse_repo_update_20260814_v2.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip requests beautifulsoup4
      - name: Fetch PBOC and unified sentiment data
        run: |
          python - <<'PY'
          import csv
          import json
          from datetime import datetime
          from scripts.fetch_reverse_repo_update_20260814_v2 import (
              DATES, OUT, pbc_7d_rows, outright_rows, sentiment_row
          )

          pbc = pbc_7d_rows()
          outright = outright_rows()
          sentiment = [sentiment_row(day) for day in DATES]
          expected = [day.isoformat() for day in DATES]
          for name, rows in [('pbc', pbc), ('sentiment', sentiment)]:
              actual = [row['date'] for row in rows]
              if actual != expected:
                  raise RuntimeError(f'{name} mismatch: {actual} != {expected}')

          data = {
              'generated_at': datetime.utcnow().isoformat() + 'Z',
              'dates': expected,
              'pbc_7d': pbc,
              'pbc_outright': outright,
              'sentiment': sentiment,
          }
          OUT.mkdir(parents=True, exist_ok=True)
          (OUT / 'update_data.json').write_text(
              json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          for filename, rows in [
              ('pbc_7d.csv', pbc),
              ('pbc_outright.csv', outright),
              ('sentiment.csv', sentiment),
          ]:
              if not rows:
                  continue
              with (OUT / filename).open('w', newline='', encoding='utf-8-sig') as handle:
                  writer = csv.DictWriter(handle, fieldnames=list(rows[0].keys()))
                  writer.writeheader()
                  writer.writerows(rows)
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reverse-repo-update-20260814
          path: data/reverse_repo_update_20260814/
          retention-days: 1

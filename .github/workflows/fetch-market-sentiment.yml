name: Fetch 2026 A-share market sentiment

on:
  push:
    branches:
      - temp-market-data-20260803-kph
    paths:
      - '.github/workflows/fetch-market-sentiment.yml'
      - 'scripts/fetch_market_sentiment_2026.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip requests
      - run: python scripts/fetch_market_sentiment_2026.py
      - uses: actions/upload-artifact@v4
        with:
          name: market-sentiment-late-july-2026
          path: |
            data/market_sentiment_2026.csv
            data/market_sentiment_raw/
          retention-days: 1
